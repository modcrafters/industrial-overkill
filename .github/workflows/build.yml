name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build against published MMDLib
        run: bash ./gradlew build -PmmdlibUseLocal=false
      - uses: actions/upload-artifact@v7
        with:
          name: industrial-overkill
          path: build/libs/*.jar
          if-no-files-found: error
